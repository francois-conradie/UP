<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { zoom:3; }
  body {
    width:827px; height:1170px; overflow:hidden; position:relative;
    background:#050505;
    font-family:"Liberation Sans", Arial, "DejaVu Sans", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .glow { position:absolute; border-radius:50%; pointer-events:none; }
  .glow.amber   { width:820px; height:560px; left:-260px; top:-200px;
                   background:radial-gradient(closest-side, rgba(180,83,9,0.42), rgba(180,83,9,0) 72%); }
  .glow.red     { width:640px; height:480px; right:-200px; top:60px;
                   background:radial-gradient(closest-side, rgba(153,27,27,0.36), rgba(153,27,27,0) 70%); }
  .glow.ember   { width:520px; height:420px; left:-140px; top:420px;
                   background:radial-gradient(closest-side, rgba(146,64,14,0.28), rgba(146,64,14,0) 70%); }
  .glow.teal    { width:520px; height:400px; left:-120px; bottom:-140px;
                   background:radial-gradient(closest-side, rgba(4,120,87,0.26), rgba(4,120,87,0) 70%); }
  .glow.emerald { width:860px; height:620px; right:-280px; bottom:-240px;
                   background:radial-gradient(closest-side, rgba(6,78,59,0.60), rgba(6,78,59,0) 74%); }
  .beam { position:absolute; left:-15%; width:130%; pointer-events:none; filter:blur(9px); }
  .beam.a { top:270px; height:110px; transform:rotate(-8deg);
             background:linear-gradient(90deg, rgba(0,0,0,0), rgba(245,158,11,0.09) 26%, rgba(239,68,68,0.07) 55%, rgba(16,185,129,0.06) 80%, rgba(0,0,0,0)); }
  .beam.b { top:760px; height:90px; transform:rotate(6deg);
             background:linear-gradient(90deg, rgba(0,0,0,0), rgba(146,64,14,0.10) 35%, rgba(239,68,68,0.06) 70%, rgba(0,0,0,0)); }
  .ghost {
    position:absolute; left:50%; top:640px; transform:translateX(-50%);
    font-size:196px; font-weight:bold; letter-spacing:6px; white-space:nowrap;
    color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,0.04);
  }
  .dots {
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.3px);
    background-size:20px 20px;
    -webkit-mask-image:radial-gradient(ellipse 85% 85% at 50% 45%, rgba(0,0,0,1), rgba(0,0,0,0.22));
  }
  .hairline { position:absolute; left:0; right:0; height:1.5px; opacity:0.6;
    background:linear-gradient(90deg, rgba(146,64,14,0) 0%, #92400e 12%, #f59e0b 34%, #ef4444 60%, #065f46 88%, rgba(6,95,70,0) 100%); }
  .hairline.top { top:44px; }
  .hairline.bot { bottom:44px; opacity:0.35; }
  .corner { position:absolute; width:30px; height:30px; opacity:0.55; }
  .corner.tl { left:20px; top:20px; border-left:1.5px solid rgba(251,191,36,0.6); border-top:1.5px solid rgba(251,191,36,0.6); }
  .corner.tr { right:20px; top:20px; border-right:1.5px solid rgba(248,113,113,0.5); border-top:1.5px solid rgba(248,113,113,0.5); }
  .corner.bl { left:20px; bottom:20px; border-left:1.5px solid rgba(237,171,114,0.5); border-bottom:1.5px solid rgba(237,171,114,0.5); }
  .corner.br { right:20px; bottom:20px; border-right:1.5px solid rgba(52,211,153,0.55); border-bottom:1.5px solid rgba(52,211,153,0.55); }
  .cross { position:absolute; font-family:"Liberation Mono",monospace; font-size:15px; color:rgba(255,255,255,0.13); }
  .hud { position:absolute; right:58px; bottom:22px; font-family:"Liberation Mono",monospace;
          font-size:9px; letter-spacing:2.5px; color:rgba(255,255,255,0.30); }
  .grain { position:absolute; inset:0; background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%20opacity%3D%270.55%27/%3E%3C/svg%3E");
            opacity:0.055; mix-blend-mode:overlay; pointer-events:none; z-index:9; }
  .content {
    position:relative; z-index:5; height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding-top:96px;
  }
  .badge-ring {
    display:inline-flex; padding:1px; border-radius:999px;
    background:linear-gradient(90deg,#b45309,#f59e0b 35%,#ef4444 70%,#047857);
    box-shadow:0 0 18px -4px rgba(245,158,11,0.5);
  }
  .badge {
    display:inline-flex; align-items:center; gap:7px;
    padding:5px 14px; border-radius:999px; background:#0d0c0a;
    font-size:11px; font-weight:bold; letter-spacing:3px; color:#e4e4e7;
  }
  .badge .dot {
    width:6px; height:6px; border-radius:50%;
    background:#fbbf24; box-shadow:0 0 9px 2px rgba(251,191,36,0.8);
  }
  h1 { margin-top:22px; font-size:52px; line-height:1.04; letter-spacing:-0.5px; text-align:center;
       color:#fafafa; text-shadow:0 2px 26px rgba(255,255,255,0.14); }
  h1 .grad {
    background:linear-gradient(92deg,#fcd34d 0%,#f59e0b 38%,#ef4444 82%,#f87171 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:none; filter:drop-shadow(0 0 18px rgba(239,68,68,0.35));
  }
  .rule { margin-top:18px; height:2px; width:250px; border-radius:2px;
    background:linear-gradient(90deg, rgba(245,158,11,0), #f59e0b 25%, #ef4444 75%, rgba(239,68,68,0));
    box-shadow:0 0 14px rgba(239,68,68,0.55); }
  .subtitle { margin-top:16px; font-size:12px; letter-spacing:4px; color:#a1a1aa; font-weight:bold; }
  /* vertical station rail */
  .stations { position:relative; margin-top:52px; display:flex; flex-direction:column; gap:16px; }
  .vrail { position:absolute; left:22px; top:-26px; bottom:-26px; width:1.5px; z-index:0;
    background:linear-gradient(180deg, rgba(245,158,11,0) 0%, #f59e0b 12%, #ef4444 50%, #10b981 88%, rgba(16,185,129,0) 100%);
    opacity:0.55; box-shadow:0 0 12px rgba(245,158,11,0.35); }
  .pill {
    position:relative; overflow:hidden; z-index:1;
    display:inline-flex; align-items:center; gap:10px;
    height:45px; width:390px; padding:0 18px 0 7px; border-radius:999px;
    border:1px solid; background:rgba(9,9,9,0.92);
  }
  .ptint { position:absolute; inset:0; border-radius:999px; }
  .pchip {
    position:relative; width:31px; height:31px; border-radius:999px; border:1px solid;
    display:flex; align-items:center; justify-content:center;
  }
  .pchip svg { width:17px; height:17px; }
  .pnum { position:relative; font-family:"Liberation Mono","DejaVu Sans Mono",monospace; font-size:11px; letter-spacing:0.5px; }
  .ptxt { position:relative; font-size:14.5px; font-weight:bold; letter-spacing:0.1px; color:#f4f4f5; white-space:nowrap; }
</style></head>
<body>
