<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { zoom:4; }
  body {
    width:1200px; height:240px; overflow:hidden; position:relative;
    background:#050505;
    font-family:"Liberation Sans", Arial, "DejaVu Sans", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* ---- aurora mesh ---- */
  .glow { position:absolute; border-radius:50%; pointer-events:none; }
  .glow.amber   { width:680px; height:360px; left:-170px; top:-60px;
                   background:radial-gradient(closest-side, rgba(180,83,9,0.42), rgba(180,83,9,0) 72%); }
  .glow.ember   { width:420px; height:260px; left:190px; top:60px;
                   background:radial-gradient(closest-side, rgba(146,64,14,0.30), rgba(146,64,14,0) 70%); }
  .glow.red     { width:560px; height:320px; left:40%; top:-70px;
                   background:radial-gradient(closest-side, rgba(153,27,27,0.38), rgba(153,27,27,0) 70%); }
  .glow.emerald { width:760px; height:400px; right:-220px; top:-20px;
                   background:radial-gradient(closest-side, rgba(6,78,59,0.62), rgba(6,78,59,0) 74%); }
  .glow.teal    { width:380px; height:240px; right:230px; top:100px;
                   background:radial-gradient(closest-side, rgba(4,120,87,0.22), rgba(4,120,87,0) 70%); }
  /* ---- light beams ---- */
  .beam { position:absolute; left:-15%; width:130%; pointer-events:none; filter:blur(7px); }
  .beam.a { top:64px; height:74px; transform:rotate(-6deg);
             background:linear-gradient(90deg, rgba(0,0,0,0), rgba(245,158,11,0.10) 26%, rgba(239,68,68,0.08) 55%, rgba(16,185,129,0.07) 80%, rgba(0,0,0,0)); }
  .beam.b { top:132px; height:52px; transform:rotate(4deg);
             background:linear-gradient(90deg, rgba(0,0,0,0), rgba(146,64,14,0.10) 35%, rgba(239,68,68,0.06) 70%, rgba(0,0,0,0)); }
  /* ---- ghost type ---- */
  .ghost {
    position:absolute; right:-30px; top:50%; transform:translateY(-50%);
    font-size:150px; font-weight:bold; letter-spacing:14px; white-space:nowrap;
    color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,0.045);
  }
  .dots {
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1.3px);
    background-size:20px 20px;
    -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 50%, rgba(0,0,0,1), rgba(0,0,0,0.25));
  }
  .hairline { position:absolute; left:0; right:0; height:1.5px; opacity:0.6;
    background:linear-gradient(90deg, rgba(146,64,14,0) 0%, #92400e 12%, #f59e0b 34%, #ef4444 60%, #065f46 88%, rgba(6,95,70,0) 100%); }
  .hairline.top { top:36px; }
  .hairline.bot { bottom:36px; opacity:0.35; }
  /* ---- HUD details ---- */
  .corner { position:absolute; width:24px; height:24px; opacity:0.55; }
  .corner.tl { left:14px; top:14px; border-left:1.5px solid rgba(251,191,36,0.6); border-top:1.5px solid rgba(251,191,36,0.6); }
  .corner.br { right:14px; bottom:14px; border-right:1.5px solid rgba(52,211,153,0.55); border-bottom:1.5px solid rgba(52,211,153,0.55); }
  .cross { position:absolute; font-family:"Liberation Mono",monospace; font-size:13px; color:rgba(255,255,255,0.13); }
  .hud { position:absolute; right:46px; bottom:16px; font-family:"Liberation Mono",monospace;
          font-size:8px; letter-spacing:2px; color:rgba(255,255,255,0.28); }
  /* ---- grain ---- */
  .grain { position:absolute; inset:0; background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%20opacity%3D%270.55%27/%3E%3C/svg%3E");
            opacity:0.055; mix-blend-mode:overlay; pointer-events:none; z-index:9; }
  /* ---- content ---- */
  .content {
    position:relative; height:100%; z-index:5;
    display:flex; align-items:center; gap:18px;
    padding:0 34px;
  }
  .left { flex:none; width:304px; }
  .badge-ring {
    display:inline-flex; padding:1px; border-radius:999px;
    background:linear-gradient(90deg,#b45309,#f59e0b 35%,#ef4444 70%,#047857);
    box-shadow:0 0 16px -4px rgba(245,158,11,0.5);
  }
  .badge {
    display:inline-flex; align-items:center; gap:6px;
    padding:3.5px 11px; border-radius:999px; background:#0d0c0a;
    font-size:9.5px; font-weight:bold; letter-spacing:2.4px; color:#e4e4e7;
  }
  .badge .dot {
    width:5px; height:5px; border-radius:50%;
    background:#fbbf24; box-shadow:0 0 8px 2px rgba(251,191,36,0.8);
  }
  h1 { margin-top:10px; font-size:31px; line-height:1.02; letter-spacing:-0.4px; white-space:nowrap;
       color:#fafafa; text-shadow:0 2px 22px rgba(255,255,255,0.14); }
  h1 .grad {
    background:linear-gradient(92deg,#fcd34d 0%,#f59e0b 38%,#ef4444 82%,#f87171 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:none; filter:drop-shadow(0 0 14px rgba(239,68,68,0.35));
  }
  .rule { margin-top:9px; height:2px; width:190px; border-radius:2px;
    background:linear-gradient(90deg,#f59e0b,#ef4444 55%,rgba(239,68,68,0));
    box-shadow:0 0 12px rgba(239,68,68,0.55); }
  .divider {
    flex:none; width:1px; height:96px;
    background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.18) 30%, rgba(255,255,255,0.18) 70%, rgba(255,255,255,0) 100%);
  }
  /* ---- pill rows with luminous rails ---- */
  .rows { flex:1; display:flex; flex-direction:column; gap:9px; position:relative; }
  .rail { position:absolute; left:-10px; right:-6px; height:1.5px; z-index:0;
    background:linear-gradient(90deg, rgba(245,158,11,0) 0%, #f59e0b 14%, #ef4444 50%, #10b981 86%, rgba(16,185,129,0) 100%);
    opacity:0.55; box-shadow:0 0 10px rgba(245,158,11,0.35); }
  .rail.r1 { top:15px; }
  .rail.r2 { top:55px; }
  .prow { display:flex; gap:8px; position:relative; z-index:1; }
  .pill {
    position:relative; overflow:hidden;
    display:inline-flex; align-items:center; gap:6px;
    height:31px; padding:0 12px 0 5px; border-radius:999px;
    border:1px solid; background:rgba(9,9,9,0.92);
  }
  .ptint { position:absolute; inset:0; border-radius:999px; }
  .pchip {
    position:relative; width:22px; height:22px; border-radius:999px; border:1px solid;
    display:flex; align-items:center; justify-content:center;
  }
  .pchip svg { width:12.5px; height:12.5px; }
  .pnum { position:relative; font-family:"Liberation Mono","DejaVu Sans Mono",monospace; font-size:8.5px; letter-spacing:0.5px; }
  .ptxt { position:relative; font-size:10.5px; font-weight:bold; letter-spacing:0.1px; color:#f4f4f5; white-space:nowrap; }
</style></head>
<body>
  <div class="glow amber"></div>

      <span class="pill" style="border-color:rgba(194,93,17,0.55);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 0 20px -4px rgba(180,83,9,0.30), 0 8px 20px -8px rgba(0,0,0,0.6)">
        <span class="ptint" style="background:linear-gradient(120deg,rgba(146,64,14,0.34),rgba(255,255,255,0) 65%)"></span>
